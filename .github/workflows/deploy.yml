# Build, attest, and deploy Lantern to Azure — one action, every push to main.
#
# Flow: blocking source/build operations plus observable diagnostics -> digest-
# pinned candidate -> image SBOM + Trivy scan -> cosign keyless sign + SLSA
# provenance + SBOM attestation ->
# stop / repin container to the exact digest / update release app settings /
# start -> poll /api/live + /api/ready + /api/version for N consecutive exact
# confirmations -> promote :latest. Any failure after the "Arm rollback" step
# repins the previous digest, restores the previous release app settings, and
# restores the previous :latest.
#
# Manual rollback (if this workflow itself is broken):
#   az webapp config container set -g rg-personal-apps-prod \
#     -n app-lantern-prod-lwxhu7jxlrbtu \
#     --container-image-name acrenzolopez01.azurecr.io/lantern@sha256:a852c84a52d8ae24e15bf43c776a97ae8bdbcd792889d0bdad21298a921a0020 \
#     --container-registry-url https://acrenzolopez01.azurecr.io
#   az webapp restart -g rg-personal-apps-prod -n app-lantern-prod-lwxhu7jxlrbtu

name: Build, attest, and deploy Lantern to Azure

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: deploy-lantern
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  RG: rg-personal-apps-prod
  ACR: acrenzolopez01
  ACR_LOGIN_SERVER: acrenzolopez01.azurecr.io
  IMAGE_REPOSITORY: lantern
  WEBAPP: app-lantern-prod-lwxhu7jxlrbtu
  PRODUCTION_URL: https://app-lantern-prod-lwxhu7jxlrbtu.azurewebsites.net
  LIVE_PATH: /api/live
  READY_PATH: /api/ready
  VERSION_PATH: /api/version

  AZURE_CLIENT_ID: caba57ae-8a22-45ba-a35e-e4d781a41b4b
  AZURE_TENANT_ID: de625678-c55b-4494-9558-14946cbb6133
  AZURE_SUBSCRIPTION_ID: 1cf02211-8d77-4658-bb6a-0f83ec831c3b

  REQUIRED_CONFIRMATIONS: '3'
  MAX_ATTEMPTS: '90'
  ROLLBACK_MAX_ATTEMPTS: '30'
  POLL_INTERVAL_SECONDS: '5'
  HTTP_TIMEOUT_SECONDS: '8'
  DEPLOYMENT_MUTATED: 'false'
  SBOM_ATTESTED: 'false'
  DIAGNOSTIC_RECORDS: deployment-diagnostics/records.jsonl

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm ci --no-audit --no-fund

      - name: Run repository checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Run production dependency audit
        id: source-audit-checker
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: >-
          node scripts/deployment-check-runner.mjs --timeout-ms 90000 --
          node scripts/deployment-checks.mjs source-audit

      - name: "Diagnostic: record production dependency audit"
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: source-dependency-audit
          category: source-audit
          phase: pre-build
          mode: record
          exit-code: ${{ steps.source-audit-checker.outputs.exit_code || (steps.source-audit-checker.outcome == 'success' && '0' || '124') }}
          report: evidence/npm-audit.json
          report-format: npm-audit-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Generate source SBOM
        id: source-sbom-checker
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: >-
          node scripts/deployment-check-runner.mjs --timeout-ms 90000 --
          node scripts/deployment-checks.mjs source-sbom

      - name: "Diagnostic: record source SBOM"
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: source-sbom
          category: sbom
          phase: pre-build
          mode: record
          exit-code: ${{ steps.source-sbom-checker.outputs.exit_code || (steps.source-sbom-checker.outcome == 'success' && '0' || '124') }}
          report: evidence/source-sbom.cdx.json
          report-format: cyclonedx-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Azure login with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Capture prior release and protected configuration
        shell: bash
        run: |
          set -euo pipefail

          config="$(az webapp config show \
            --resource-group "$RG" --name "$WEBAPP" \
            --query '{alwaysOn:alwaysOn, workers:numberOfWorkers, image:linuxFxVersion}' \
            --output json)"

          configured_ref="$(jq -r '.image' <<<"$config")"
          configured_ref="${configured_ref#DOCKER|}"
          expected_prefix="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY"
          case "$configured_ref" in
            "$expected_prefix"@sha256:*)
              previous_ref="$configured_ref"
              previous_digest="${configured_ref##*@}"
              ;;
            "$expected_prefix":*)
              previous_spec="${configured_ref#"$ACR_LOGIN_SERVER/"}"
              previous_digest="$(az acr repository show --name "$ACR" \
                --image "$previous_spec" --query digest --output tsv)"
              previous_ref="$expected_prefix@$previous_digest"
              ;;
            *)
              echo "::error::Current image is outside $expected_prefix"
              exit 1
              ;;
          esac
          [[ "$previous_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          previous_latest_digest="$(az acr repository show --name "$ACR" \
            --image "$IMAGE_REPOSITORY:latest" --query digest --output tsv 2>/dev/null || true)"
          [[ "$previous_latest_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || previous_latest_digest="$previous_digest"

          prev_settings="$(az webapp config appsettings list \
            --resource-group "$RG" --name "$WEBAPP" --output json)"
          prev_build_sha="$(jq -r '(map({(.name): .value}) | add).BUILD_SHA // ""' <<<"$prev_settings")"
          prev_build_id="$(jq -r '(map({(.name): .value}) | add).BUILD_ID // ""' <<<"$prev_settings")"

          prev_version="$(curl -fsS --max-time "$HTTP_TIMEOUT_SECONDS" \
            -H 'Cache-Control: no-cache' \
            "$PRODUCTION_URL$VERSION_PATH?deploy-baseline=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>/dev/null || echo '{}')"
          prev_instance_id="$(jq -r '.instanceId // ""' <<<"$prev_version")"
          prev_commit="$(jq -r '.commit // ""' <<<"$prev_version")"

          {
            echo "PREVIOUS_IMAGE_REFERENCE=$previous_ref"
            echo "PREVIOUS_IMAGE_DIGEST=$previous_digest"
            echo "PREVIOUS_LATEST_DIGEST=$previous_latest_digest"
            echo "PREVIOUS_BUILD_SHA_SETTING=$prev_build_sha"
            echo "PREVIOUS_BUILD_ID_SETTING=$prev_build_id"
            echo "PREVIOUS_INSTANCE_ID=$prev_instance_id"
            echo "PREVIOUS_COMMIT=$prev_commit"
          } >> "$GITHUB_ENV"
          echo "Prior digest $previous_digest, instance ${prev_instance_id:-unknown}, commit ${prev_commit:-unknown}"

      - name: Check migration compatibility
        id: migration-checker
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: >-
          node scripts/deployment-check-runner.mjs --timeout-ms 45000 --
          node scripts/deployment-checks.mjs migration

      - name: "Diagnostic: record migration compatibility"
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: migration-compatibility-precheck
          category: migration-precondition
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.migration-checker.outputs.exit_code || (steps.migration-checker.outcome == 'success' && '0' || '124') }}
          report: evidence/migration-check.json
          report-format: generic-json
          evidence: evidence/migration-readiness.json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Check backup and recovery freshness
        id: recovery-checker
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: >-
          node scripts/deployment-check-runner.mjs --timeout-ms 90000 --
          node scripts/deployment-checks.mjs recovery

      - name: "Diagnostic: record backup and recovery freshness"
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: recovery-precondition-precheck
          category: recovery-precondition
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.recovery-checker.outputs.exit_code || (steps.recovery-checker.outcome == 'success' && '0' || '124') }}
          report: evidence/recovery-check.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Check pre-activation readiness
        id: readiness-checker
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: >-
          node scripts/deployment-check-runner.mjs --timeout-ms 45000 --
          node scripts/deployment-checks.mjs readiness

      - name: "Diagnostic: record pre-activation readiness"
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: readiness-precondition-precheck
          category: readiness-precondition
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.readiness-checker.outputs.exit_code || (steps.readiness-checker.outcome == 'success' && '0' || '124') }}
          report: evidence/readiness-check.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Check monitoring resources
        id: monitoring-checker
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: >-
          node scripts/deployment-check-runner.mjs --timeout-ms 90000 --
          node scripts/deployment-checks.mjs monitoring

      - name: "Diagnostic: record monitoring resources"
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: monitoring-precheck
          category: monitoring-precheck
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.monitoring-checker.outputs.exit_code || (steps.monitoring-checker.outcome == 'success' && '0' || '124') }}
          report: evidence/monitor-precheck.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Check protected configuration
        id: protected-config-checker
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: >-
          node scripts/deployment-check-runner.mjs --timeout-ms 45000 --
          node scripts/deployment-checks.mjs protected-configuration

      - name: "Diagnostic: record protected configuration"
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: protected-configuration-precheck
          category: protected-configuration-precheck
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.protected-config-checker.outputs.exit_code || (steps.protected-config-checker.outcome == 'success' && '0' || '124') }}
          report: evidence/config-fingerprint.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Build, push, and inspect digest-pinned candidate
        id: image
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          repo="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY"
          candidate_tag="$repo:$GITHUB_SHA-$BUILD_ID"

          # The github-lantern-ci identity holds AcrPush (which includes AcrPull)
          # but not the registry-Contributor action az acr build / az acr import
          # need, so the image is built on the runner and pushed with docker.
          az acr login --name "$ACR"
          docker build \
            --build-arg "BUILD_SHA=$GITHUB_SHA" \
            --build-arg "BUILD_ID=$BUILD_ID" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$BUILD_ID" \
            --tag "$candidate_tag" \
            .
          docker push "$candidate_tag"

          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$candidate_tag" | sed 's/.*@//')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            digest="$(az acr repository show --name "$ACR" \
              --image "$IMAGE_REPOSITORY:$GITHUB_SHA-$BUILD_ID" --query digest --output tsv)"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          image_ref="$repo@$digest"
          docker pull "$image_ref"
          docker image inspect "$image_ref" --format '{{json .Config.Volumes}}' \
            | jq -e '[((. // {}) | keys[]) | select(. == "/home" or startswith("/home/"))] | length == 0' > /dev/null
          revision="$(docker image inspect "$image_ref" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          image_version="$(docker image inspect "$image_ref" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          [[ "$revision" == "$GITHUB_SHA" ]]
          [[ "$image_version" == "$BUILD_ID" ]]

          {
            echo "ref=$image_ref"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          {
            echo "IMAGE_REFERENCE=$image_ref"
            echo "IMAGE_DIGEST=$digest"
            echo "BUILD_ID=$BUILD_ID"
            echo "DIAGNOSTIC_CANDIDATE_DIGEST=$digest"
            echo "DIAGNOSTIC_BUILD_ID=$BUILD_ID"
          } >> "$GITHUB_ENV"

      - name: Set up exact-image SBOM scanner
        id: syft-setup
        continue-on-error: true
        timeout-minutes: 2
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.42.3

      - name: Generate exact-image SBOM
        id: image-sbom
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          SYFT_CMD: ${{ steps.syft-setup.outputs.cmd }}
          SYFT_SETUP_OUTCOME: ${{ steps.syft-setup.outcome }}
        run: >-
          node scripts/deployment-check-runner.mjs --timeout-ms 240000 --
          node scripts/deployment-checks.mjs image-sbom

      - name: "Diagnostic: record exact-image SBOM"
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: image-sbom
          category: sbom
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.image-sbom.outputs.exit_code || (steps.image-sbom.outcome == 'success' && '0' || '124') }}
          report: evidence/image-sbom.spdx.json
          report-format: spdx-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Set up exact-image vulnerability scanner
        id: trivy-setup
        continue-on-error: true
        timeout-minutes: 2
        # aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        # (v0.36.0) delegates setup to this exact action and Trivy version.
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true
          token: ${{ github.token }}

      - name: Resolve vulnerability database cache date
        id: trivy-date
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore vulnerability database cache
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.trivy-date.outputs.date }}
          restore-keys: cache-trivy-

      - name: Scan exact image for HIGH and CRITICAL vulnerabilities
        id: image-scan
        continue-on-error: true
        timeout-minutes: 11
        shell: bash
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
          TRIVY_SETUP_OUTCOME: ${{ steps.trivy-setup.outcome }}
        run: >-
          node scripts/deployment-check-runner.mjs --timeout-ms 630000 --
          node scripts/deployment-checks.mjs image-scan

      - name: "Diagnostic: record image vulnerability scan"
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: image-vulnerability-scan
          category: image-scan
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.image-scan.outputs.exit_code || (steps.image-scan.outcome == 'success' && '0' || '124') }}
          report: evidence/trivy-image.json
          report-format: trivy-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and attest exact image
        shell: bash
        run: |
          set -euo pipefail
          workflow_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/deploy.yml@$GITHUB_REF"
          started_on="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg buildType "https://github.com/EnzoLopez2023/azure-infra/blob/main/DEPLOYMENT_RUNBOOK.md" \
            --arg repository "git+https://github.com/$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg workflow "$workflow_identity" \
            --arg invocation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg started "$started_on" \
            '{
              buildDefinition: {
                buildType: $buildType,
                externalParameters: { repository: $repository, ref: env.GITHUB_REF },
                internalParameters: { invocationId: $invocation },
                resolvedDependencies: [{ uri: $repository, digest: { gitCommit: $sha } }]
              },
              runDetails: {
                builder: { id: $workflow },
                metadata: { invocationId: $invocation, startedOn: $started }
              }
            }' > evidence/provenance.slsa.json

          cosign sign --yes "$IMAGE_REFERENCE"
          cosign attest --yes --predicate evidence/provenance.slsa.json \
            --type slsaprovenance1 "$IMAGE_REFERENCE"
          if jq -e 'type == "object" and (.spdxVersion | type == "string") and
            (.packages | type == "array")' evidence/image-sbom.spdx.json > /dev/null 2>&1; then
            cosign attest --yes --predicate evidence/image-sbom.spdx.json \
              --type spdxjson "$IMAGE_REFERENCE"
            echo "SBOM_ATTESTED=true" >> "$GITHUB_ENV"
          else
            echo "::warning title=Deployment diagnostics: image-sbom::Exact-image SBOM output is unavailable or malformed, so no SBOM attestation was attached. Deployment continues and the diagnostic record is retained for remediation."
          fi

      - name: Verify exact image signature
        id: signature-checker
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: >-
          node scripts/deployment-check-runner.mjs --timeout-ms 90000 --
          node scripts/deployment-checks.mjs signature

      - name: "Diagnostic: record signature verification"
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: signature-verification
          category: signature-provenance
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.signature-checker.outputs.exit_code || (steps.signature-checker.outcome == 'success' && '0' || '124') }}
          report: evidence/cosign-signature.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Verify provenance attestation
        id: provenance-checker
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: >-
          node scripts/deployment-check-runner.mjs --timeout-ms 90000 --
          node scripts/deployment-checks.mjs provenance

      - name: "Diagnostic: record provenance attestation verification"
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: provenance-attestation-verification
          category: signature-provenance
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.provenance-checker.outputs.exit_code || (steps.provenance-checker.outcome == 'success' && '0' || '124') }}
          report: evidence/cosign-provenance.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Verify SBOM attestation
        id: sbom-attestation-checker
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: >-
          node scripts/deployment-check-runner.mjs --timeout-ms 90000 --
          node scripts/deployment-checks.mjs sbom-attestation

      - name: "Diagnostic: record SBOM attestation verification"
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: provenance-attestation-verification
          category: signature-provenance
          phase: pre-activation
          mode: record
          exit-code: ${{ steps.sbom-attestation-checker.outputs.exit_code || (steps.sbom-attestation-checker.outcome == 'success' && '0' || '124') }}
          report: evidence/cosign-sbom.json
          report-format: generic-json
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Refresh Azure login before production activation
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Arm rollback before production mutation
        shell: bash
        run: echo "DEPLOYMENT_MUTATED=true" >> "$GITHUB_ENV"

      - name: Activate inspected digest as production release
        shell: bash
        run: |
          set -euo pipefail

          az webapp stop --resource-group "$RG" --name "$WEBAPP" --output none
          absent=0
          for attempt in $(seq 1 60); do
            state="$(az webapp show --resource-group "$RG" --name "$WEBAPP" --query state --output tsv)"
            status="$(curl -sS --max-time 3 -o /dev/null -w '%{http_code}' \
              "$PRODUCTION_URL$LIVE_PATH?stop-proof=$GITHUB_RUN_ID-$attempt" 2>/dev/null || true)"
            if [[ "$state" == "Stopped" && ! "$status" =~ ^2 ]]; then
              absent=$((absent + 1)); [[ "$absent" -ge 3 ]] && break
            else
              absent=0
            fi
            sleep 2
          done
          [[ "$absent" -ge 3 ]]

          az webapp config container set --resource-group "$RG" --name "$WEBAPP" \
            --container-image-name "$IMAGE_REFERENCE" \
            --container-registry-url "https://$ACR_LOGIN_SERVER" --output none
          [[ "$(az webapp config show --resource-group "$RG" --name "$WEBAPP" \
            --query linuxFxVersion --output tsv)" == "DOCKER|$IMAGE_REFERENCE" ]]

          az webapp config appsettings set --resource-group "$RG" --name "$WEBAPP" \
            --settings "BUILD_SHA=$GITHUB_SHA" "BUILD_ID=$BUILD_ID" --output none

          az webapp start --resource-group "$RG" --name "$WEBAPP" --output none

      - name: Verify candidate is the exact release
        shell: bash
        run: |
          set -euo pipefail
          confirm=0
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            nonce="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
            live="$(curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" -o /dev/null -w '%{http_code}' \
              "$PRODUCTION_URL$LIVE_PATH?probe=$nonce" 2>/dev/null || true)"
            ready="$(curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" \
              "$PRODUCTION_URL$READY_PATH?probe=$nonce" 2>/dev/null || echo '{}')"
            ver="$(curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" \
              "$PRODUCTION_URL$VERSION_PATH?probe=$nonce" 2>/dev/null || echo '{}')"

            commit="$(jq -r '.commit // ""' <<<"$ver" 2>/dev/null || echo "")"
            build_id="$(jq -r '.buildId // ""' <<<"$ver" 2>/dev/null || echo "")"
            instance="$(jq -r '.instanceId // ""' <<<"$ver" 2>/dev/null || echo "")"

            ok=1
            [[ "$live" == "200" ]] || ok=0
            jq -e '.status == "ready"' <<<"$ready" > /dev/null 2>&1 || ok=0
            [[ "$commit" == "$GITHUB_SHA" ]] || ok=0
            [[ "$build_id" == "$BUILD_ID" ]] || ok=0
            if [[ -n "$PREVIOUS_INSTANCE_ID" && "$instance" == "$PREVIOUS_INSTANCE_ID" ]]; then ok=0; fi

            if [[ "$ok" == "1" ]]; then
              confirm=$((confirm + 1))
              echo "exact confirmation $confirm/$REQUIRED_CONFIRMATIONS (attempt $attempt)"
              [[ "$confirm" -ge "$REQUIRED_CONFIRMATIONS" ]] && break
            else
              [[ "$confirm" -gt 0 ]] && echo "streak reset at attempt $attempt (live=$live commit=${commit:-none} buildId=${build_id:-none})"
              confirm=0
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done
          [[ "$confirm" -ge "$REQUIRED_CONFIRMATIONS" ]]

      - name: Promote verified digest to :latest
        shell: bash
        run: |
          set -euo pipefail
          latest="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:latest"
          docker tag "$IMAGE_REFERENCE" "$latest"
          docker push "$latest"
          [[ "$(az acr repository show --name "$ACR" --image "$IMAGE_REPOSITORY:latest" \
            --query digest --output tsv)" == "$IMAGE_DIGEST" ]]

      - name: Confirm promoted release
        shell: bash
        run: |
          set -euo pipefail
          confirm=0
          for attempt in $(seq 1 12); do
            ver="$(curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" \
              "$PRODUCTION_URL$VERSION_PATH?promoted=$GITHUB_RUN_ID-$attempt" 2>/dev/null || echo '{}')"
            if [[ "$(jq -r '.commit // ""' <<<"$ver")" == "$GITHUB_SHA" ]]; then
              confirm=$((confirm + 1)); [[ "$confirm" -ge "$REQUIRED_CONFIRMATIONS" ]] && break
            else
              confirm=0
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done
          [[ "$confirm" -ge "$REQUIRED_CONFIRMATIONS" ]]

          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg buildId "$BUILD_ID" \
            --arg image "$IMAGE_REFERENCE" \
            --arg previous "$PREVIOUS_IMAGE_REFERENCE" \
            --arg run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --argjson sbomAttested "$SBOM_ATTESTED" \
            '{sha: $sha, buildId: $buildId, image: $image, previousImage: $previous,
              workflowRun: $run, confirmations: 3, signed: true, provenanceAttested: true,
              sbomAttested: $sbomAttested, rollbackPerformed: false}' > evidence/deployment.json
          {
            echo "### Lantern deployed"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Build ID: \`$BUILD_ID\`"
            echo "- Image: \`$IMAGE_REFERENCE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore prior release after failure or cancellation
        if: ${{ always() && (failure() || cancelled()) && env.DEPLOYMENT_MUTATED == 'true' }}
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo "::warning::Restoring prior Lantern release $PREVIOUS_IMAGE_REFERENCE"

          az webapp stop --resource-group "$RG" --name "$WEBAPP" --output none
          absent=0
          for attempt in $(seq 1 "$ROLLBACK_MAX_ATTEMPTS"); do
            state="$(az webapp show --resource-group "$RG" --name "$WEBAPP" --query state --output tsv)"
            status="$(curl -sS --max-time 3 -o /dev/null -w '%{http_code}' \
              "$PRODUCTION_URL$LIVE_PATH?rollback-stop=$GITHUB_RUN_ID-$attempt" 2>/dev/null || true)"
            if [[ "$state" == "Stopped" && ! "$status" =~ ^2 ]]; then
              absent=$((absent + 1)); [[ "$absent" -ge 3 ]] && break
            else
              absent=0
            fi
            sleep 2
          done

          if [[ -n "$PREVIOUS_IMAGE_REFERENCE" ]]; then
            az webapp config container set --resource-group "$RG" --name "$WEBAPP" \
              --container-image-name "$PREVIOUS_IMAGE_REFERENCE" \
              --container-registry-url "https://$ACR_LOGIN_SERVER" --output none
          fi
          if [[ -n "$PREVIOUS_BUILD_SHA_SETTING" && -n "$PREVIOUS_BUILD_ID_SETTING" ]]; then
            az webapp config appsettings set --resource-group "$RG" --name "$WEBAPP" \
              --settings "BUILD_SHA=$PREVIOUS_BUILD_SHA_SETTING" "BUILD_ID=$PREVIOUS_BUILD_ID_SETTING" --output none
          fi
          az webapp start --resource-group "$RG" --name "$WEBAPP" --output none

          if [[ "$PREVIOUS_LATEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            prev_latest="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@$PREVIOUS_LATEST_DIGEST"
            az acr login --name "$ACR" || true
            docker pull "$prev_latest" \
              && docker tag "$prev_latest" "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:latest" \
              && docker push "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:latest" || true
          fi

          restored=0
          for attempt in $(seq 1 "$ROLLBACK_MAX_ATTEMPTS"); do
            live="$(curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" -o /dev/null -w '%{http_code}' \
              "$PRODUCTION_URL$LIVE_PATH?rollback-proof=$GITHUB_RUN_ID-$attempt" 2>/dev/null || true)"
            ver="$(curl -sS --max-time "$HTTP_TIMEOUT_SECONDS" \
              "$PRODUCTION_URL$VERSION_PATH?rollback-proof=$GITHUB_RUN_ID-$attempt" 2>/dev/null || echo '{}')"
            commit="$(jq -r '.commit // ""' <<<"$ver")"
            match=1
            [[ "$live" == "200" ]] || match=0
            if [[ -n "$PREVIOUS_COMMIT" && "$commit" != "$PREVIOUS_COMMIT" ]]; then match=0; fi
            if [[ "$match" == "1" ]]; then
              restored=$((restored + 1)); [[ "$restored" -ge 3 ]] && break
            else
              restored=0
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done
          [[ "$restored" -ge 3 ]]

          jq -n \
            --arg image "$PREVIOUS_IMAGE_REFERENCE" \
            --arg commit "$PREVIOUS_COMMIT" \
            '{rollbackPerformed: true, restoredImage: $image, restoredCommit: $commit}' \
            > evidence/rollback.json

      - name: "Diagnostic: aggregate results"
        if: ${{ always() }}
        uses: ./.github/actions/deployment-diagnostic
        with:
          check-id: aggregate
          category: nested-checker
          phase: pre-activation
          mode: aggregate
          records: ${{ env.DIAGNOSTIC_RECORDS }}

      - name: Upload nonsecret deployment and diagnostic evidence
        id: evidence-upload
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
             deployment-diagnostics/records.jsonl
             deployment-diagnostics/records-summary.json
             evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Warn when evidence upload fails
        if: ${{ always() && steps.evidence-upload.outcome == 'failure' }}
        shell: bash
        run: >-
          echo "::warning title=Deployment diagnostics upload::Diagnostic and
          deployment evidence could not be uploaded; inspect the upload step
          logs and remediate on the next build."
