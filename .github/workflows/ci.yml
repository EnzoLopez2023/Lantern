name: CI

# Pull requests only. Pushes to main are validated by the first stage of
# deploy.yml (npm run check + prod-dep audit + a full image build) before
# anything ships, so running CI on main as well would just double the work.
on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build --tag lantern-ci:${{ github.sha }} .
